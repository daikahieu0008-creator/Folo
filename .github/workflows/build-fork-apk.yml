name: 🚀 Build Folo Android APK (Fork)

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/build-fork-apk.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: 📱 Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 🧹 Dọn dẹp dung lượng đĩa
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/julia*
          df -h /

      - name: 📦 Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 📦 Cài đặt pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 🏗 Cài đặt Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: ☕ Cài đặt Java 17 (Zulu)
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"

      - name: 🐘 Cấu hình Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: 🤖 Cài đặt Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: 🔧 Tối ưu cấu hình Standalone (Tắt Dev Client để vào thẳng app)
        run: |
          node -e "const p = require('./apps/mobile/package.json'); delete p.dependencies['expo-dev-client']; require('fs').writeFileSync('./apps/mobile/package.json', JSON.stringify(p, null, 2));"

      - name: 📥 Cài đặt dependencies
        run: pnpm install --no-frozen-lockfile --child-concurrency=1

      - name: 🌐 Build Mobile Web Assets
        run: pnpm --dir apps/mobile/web-app build --outDir ../../../out/rn-web/html-renderer

      - name: ⚙️ Tạo mã nguồn Android Native (Expo Prebuild)
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --clean --no-install
          # Cấu hình chữ ký debug cho bản release để cài đặt tự do không lỗi
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle
          sed -i 's/minifyEnabled enableProguardInReleaseBuilds/minifyEnabled false/g' android/app/build.gradle
        env:
          EXPO_NO_TELEMETRY: "1"

      - name: 🔨 Biên dịch Standalone Android APK (Gradle)
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 📤 Xuất bản file APK lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: folo-standalone-app-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
