name: 🚀 Build Folo Android APK (Fork)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Loại APK cần build"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - dev
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/build-fork-apk.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 🧹 Dọn dẹp dung lượng đĩa
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/julia*
          df -h /

      - name: 📦 Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 📦 Cài đặt pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 🏗 Cài đặt Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: ☕ Cài đặt Java 17 (Zulu)
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"

      - name: 🤖 Cài đặt Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: 📥 Cài đặt dependencies
        run: pnpm install --no-frozen-lockfile --child-concurrency=1

      - name: 🌐 Build Mobile Web Assets
        run: pnpm --dir apps/mobile/web-app build --outDir ../../../out/rn-web/html-renderer

      - name: ⚙️ Tạo mã nguồn Android Native (Expo Prebuild)
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: "1"

      - name: 🔨 Biên dịch Android APK (Gradle)
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          build_type="${{ github.event.inputs.build_type || 'debug' }}"
          if [ "$build_type" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: 📤 Xuất bản file APK lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: folo-custom-site-gemini-apk
          path: apps/mobile/android/app/build/outputs/apk/**/*.apk
          retention-days: 30
